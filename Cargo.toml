[workspace]
members = [
  ".",
  "crates/typed-store",
  "crates/typed-store-derive",
  "crates/typed-store-error",
  "crates/lightpool-macros",
]
resolver = "2"

# Shared deps for vendored lightpool crates (typed-store / lightpool-macros).
# Keep versions aligned with lightpool/Cargo.toml workspace.dependencies.
[workspace.dependencies]
anyhow = "1.0.38"
thiserror = "1.0.21"
serde = { version = "1.0", features = ["derive"] }
bcs = "0.1"
bincode = { version = "1.3.3" }
collectable = "0.0.2"
eyre = "0.6.8"
fdlimit = "0.2.1"
once_cell = "1.18.0"
tap = "1.0.1"
prometheus = "0.13.3"
hdrhistogram = "7.5.2"
rocksdb = { version = "0.21.0", default-features = false, features = ["snappy", "lz4", "zstd", "zlib", "multi-threaded-cf"] }
tokio = { version = "1.5.0", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread", "signal"] }
tracing = "0.1.37"
rand = "0.7.3"
async-trait = "0.1.50"
itertools = "0.10.5"
proc-macro2 = "1.0.60"
quote = "1.0.28"
syn = { version = "1.0.104", features = ["full", "derive", "extra-traits"] }
tempfile = "3.2.0"
rstest = "0.18.2"
uint = "0.9.5"
paste = "1.0.14"
futures = "0.3.14"
typed-store = { path = "crates/typed-store" }
typed-store-derive = { path = "crates/typed-store-derive" }
typed-store-error = { path = "crates/typed-store-error" }
lightpool-macros = { path = "crates/lightpool-macros" }

[package]
name = "lightpool-clob-indexer"
version = "0.6.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.96.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1.5.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.61"
thiserror = "1.0.21"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
bincode = "1.3"
hex = "0.4"
bytes = "1"
dashmap = "5"
tokio-util = { version = "0.7", features = ["codec"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
eyre = "0.6"

lightpool-sdk = { path = "../lightpool-sdk-rust" }
typed-store = { workspace = true }
bcs = "0.1"
tempfile = "3"

[[bin]]
name = "lightpool-clob-indexer"
path = "src/main.rs"

[[bin]]
name = "checkpoint_bench"
path = "src/bin/checkpoint_bench.rs"

[[example]]
name = "submit_repro"
path = "examples/submit_repro.rs"
